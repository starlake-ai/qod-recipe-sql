[project]
name = "qod-recipe-sql"
version = "0.1.0"
description = "Plain SQL builds the tables, Quack on Demand serves them."
requires-python = ">=3.10,<3.14"
dependencies = [
    "adbc-driver-flightsql>=1.1.0",
    "adbc-driver-manager>=1.1.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
