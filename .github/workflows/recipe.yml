name: recipe

on:
  push:
  pull_request:
  # The weekly run against qod@latest lives in starlake-ai/qod
  # (.github/workflows/recipes.yml): GitHub disables schedules in a repository
  # with no commit for 60 days.
  workflow_dispatch:

jobs:
  recipe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Unit tests
        run: uv run pytest -q
      - name: Run the recipe
        run: ./run.sh
      - name: Run it again while the gateway is still up
        run: ./run.sh
      - name: Stop the gateway
        if: always()
        run: ./run.sh stop
      - name: Keep the gateway log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recipe-logs-${{ matrix.os }}
          path: out/*.log
          if-no-files-found: ignore
